name: GaonGrow APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
        working-directory: Desktop/GaonGrow

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: Desktop/GaonGrow/android

      - uses: actions/upload-artifact@v4
        with:
          name: GaonGrow-APK
          path: Desktop/GaonGrow/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
