name: GaonGrow APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
            - name: Copy web assets to Android
        run: |
          mkdir -p Desktop/GaonGrow/android/app/src/main/assets/public
          cp Desktop/GaonGrow/index.html Desktop/GaonGrow/android/app/src/main/assets/public/ 2>/dev/null || true
          cp Desktop/GaonGrow/manifest.json Desktop/GaonGrow/android/app/src/main/assets/public/ 2>/dev/null || true
          cp Desktop/GaonGrow/sw.js Desktop/GaonGrow/android/app/src/main/assets/public/ 2>/dev/null || true
          for dir in screens assets services components; do
            [ -d "Desktop/GaonGrow/$dir" ] && cp -r "Desktop/GaonGrow/$dir" "Desktop/GaonGrow/android/app/src/main/assets/public/" || true
          done
          echo '[]' > Desktop/GaonGrow/android/app/src/main/assets/capacitor.plugins.json
        run: npm install --legacy-peer-deps
        working-directory: Desktop/GaonGrow

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: Desktop/GaonGrow/android

      - uses: actions/upload-artifact@v4
        with:
          name: GaonGrow-APK
          path: Desktop/GaonGrow/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
