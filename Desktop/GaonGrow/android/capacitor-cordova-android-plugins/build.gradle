apply plugin: 'com.android.library'
apply from: 'cordova.variables.gradle'

android {
    namespace 'com.getcapacitor.cordova'
    compileSdk 35
    defaultConfig {
        minSdkVersion 22
        targetSdkVersion 35
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
