name: Build GaonGrow-v1.01.01.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move files to root
        run: |
          if [ -d "Desktop/GaonGrow" ]; then
            cp -r Desktop/GaonGrow/. ./
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --legacy-peer-deps

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r screens www/screens 2>/dev/null || true
          cp -r assets www/assets 2>/dev/null || true
          cp -r services www/services 2>/dev/null || true
          cp -r components www/components 2>/dev/null || true
          mkdir -p android/app/src/main/assets/public
          cp -r www/. android/app/src/main/assets/public/
          echo '[]' > android/app/src/main/assets/capacitor.plugins.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GaonGrow-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
