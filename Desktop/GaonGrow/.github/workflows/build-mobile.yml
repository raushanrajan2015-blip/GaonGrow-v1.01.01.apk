name: 📱 GaonGrow — Build Android APK + iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Manual trigger button on GitHub

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

# ============================================================
# JOB 1: BUILD ANDROID APK
# ============================================================
jobs:
  build-android:
    name: 🤖 Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 📁 Prepare WWW Build Folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp -r screens www/screens
          cp -r assets www/assets
          cp -r services www/services
          cp -r components www/components
          echo "✅ WWW folder ready"

      - name: ☕ Setup Java JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🔨 Grant Gradle Execute Permission
        run: chmod +x android/gradlew

      - name: 🏗️ Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: ✅ Copy APK with Correct Name
        run: |
          cp android/app/build/outputs/apk/debug/GaonGrow-v1.01.01.apk \
             GaonGrow-v1.01.01.apk || \
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             GaonGrow-v1.01.01.apk
          echo "✅ APK: GaonGrow-v1.01.01.apk"

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GaonGrow-Android-APK
          path: GaonGrow-v1.01.01.apk
          retention-days: 30

      - name: 💬 Build Summary
        run: |
          echo "## ✅ Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "📱 **File:** \`GaonGrow-v1.01.01.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download from **Artifacts** section above" >> $GITHUB_STEP_SUMMARY

# ============================================================
# JOB 2: BUILD iOS (macOS Cloud Runner)
# ============================================================
  build-ios:
    name: 🍎 iOS Build (macOS)
    runs-on: macos-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 📁 Prepare WWW Build Folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
          cp sw.js www/
          cp -r screens www/screens
          cp -r assets www/assets
          cp -r services www/services
          cp -r components www/components
          echo "✅ WWW folder ready"

      - name: 🍎 Add iOS Capacitor Platform
        run: npx cap add ios

      - name: 🔄 Sync Capacitor iOS
        run: npx cap sync ios

      - name: 🔧 Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📋 Show Xcode Version
        run: xcodebuild -version

      - name: 🏗️ Build iOS App (Simulator — No Signing Required)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/DerivedData \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty --color || true

      # ── SIGNED IPA (Only runs if secrets are set) ──────────────
      - name: 🔐 Build Signed IPA (Real Device)
        if: |
          secrets.APPLE_CERTIFICATE_BASE64 != '' &&
          secrets.APPLE_CERTIFICATE_PASSWORD != '' &&
          secrets.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: gaongrow-build-2026
        run: |
          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/gaongrow.mobileprovision

          # Archive and export IPA
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ios/GaonGrow.xcarchive \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath ios/GaonGrow.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ios/IPA

          echo "✅ Signed IPA built!"

      - name: 📤 Upload iOS Simulator Build
        uses: actions/upload-artifact@v4
        with:
          name: GaonGrow-iOS-Simulator-Build
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Signed IPA (if available)
        uses: actions/upload-artifact@v4
        with:
          name: GaonGrow-iOS-Signed-IPA
          path: ios/IPA/*.ipa
          retention-days: 30
          if-no-files-found: ignore

      - name: 💬 Build Summary
        run: |
          echo "## ✅ iOS Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "📱 **Simulator Build** uploaded to Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 For Real Device IPA:" >> $GITHUB_STEP_SUMMARY
          echo "Set these GitHub Secrets in Settings → Secrets:" >> $GITHUB_STEP_SUMMARY
          echo "- \`APPLE_CERTIFICATE_BASE64\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`APPLE_CERTIFICATE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`APPLE_PROVISIONING_PROFILE_BASE64\`" >> $GITHUB_STEP_SUMMARY
