<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaonGrow - Photo Capture</title>
  <script src="../config/tailwind-setup.js"></script>
  <script src="../components/layout.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface">
<main class="mt-20 px-4 max-w-lg mx-auto pb-32">
  <div class="mb-lg">
    <h2 class="font-headline-md text-primary">Member Photo</h2>
    <p class="font-body-md text-on-surface-variant">Capture a live photo of the member.</p>
  </div>

  <div class="bg-black rounded-2xl w-full h-[400px] relative overflow-hidden flex items-center justify-center mb-lg shadow-md">
    <!-- Camera Viewfinder Mockup -->
    <div class="absolute inset-0 opacity-30 border-[16px] border-black pointer-events-none z-10"></div>
    <div class="w-48 h-64 border-2 border-white/50 rounded-full absolute z-20"></div>
    
    <img src="https://ui-avatars.com/api/?name=Savitri+Devi&background=3f6653&color=fff&size=512" class="w-full h-full object-cover opacity-80 mix-blend-luminosity" alt="Camera feed">
    
    <div class="absolute bottom-6 left-0 right-0 flex justify-center z-30">
      <button class="w-16 h-16 rounded-full bg-white border-4 border-outline flex items-center justify-center active:scale-90 transition-transform">
      </button>
    </div>
  </div>

  <div class="bg-surface-container p-4 rounded-xl flex items-start gap-md border border-outline-variant">
    <span class="material-symbols-outlined text-primary">info</span>
    <p class="font-body-md text-sm text-on-surface m-0">Ensure the face is clearly visible, well-lit, and matches the outline. Do not wear sunglasses or hats.</p>
  </div>

  <div class="mt-xl flex gap-md">
    <button onclick="window.history.back()" class="flex-1 h-[56px] border border-outline text-primary rounded-lg font-label-lg active:scale-95 transition-transform">Back</button>
    <a href="verify_submit.html" class="flex-[2] h-[56px] bg-primary text-on-primary rounded-lg font-label-lg flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform">
      Verify & Submit
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>
  </div>
</main>
</body>
</html>
