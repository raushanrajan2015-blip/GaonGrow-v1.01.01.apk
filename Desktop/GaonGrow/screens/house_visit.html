<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaonGrow - House Visit</title>
  <script src="../config/tailwind-setup.js"></script>
  <script src="../components/layout.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface">
<main class="mt-20 px-4 max-w-lg mx-auto pb-32">
  <div class="mb-lg">
    <h2 class="font-headline-md text-primary">House Visit</h2>
    <p class="font-body-md text-on-surface-variant">Applicant: Savitri Devi</p>
  </div>

  <form class="space-y-6">
    <div class="space-y-md">
      <h3 class="font-title-lg text-[16px] text-on-surface border-b border-outline-variant pb-2">Location Verification</h3>
      
      <div class="bg-surface-container p-4 rounded-xl flex items-center justify-between border border-outline-variant">
        <div>
          <p class="font-title-lg text-[16px] m-0">GPS Coordinates</p>
          <p class="font-body-md text-sm text-on-surface-variant m-0">Lat: 21.2514, Lng: 81.6296</p>
        </div>
        <button type="button" class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center active:scale-95 transition-transform">
          <span class="material-symbols-outlined">my_location</span>
        </button>
      </div>
      
      <p class="text-xs text-primary font-bold">✓ Location matches provided address</p>
    </div>

    <div class="space-y-md">
      <h3 class="font-title-lg text-[16px] text-on-surface border-b border-outline-variant pb-2">Living Standard Assessment</h3>
      
      <div>
        <label class="font-label-lg text-on-surface-variant block mb-1">House Condition</label>
        <select class="w-full h-[56px] px-4 border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest">
          <option>Pucca (Concrete)</option>
          <option>Semi-Pucca</option>
          <option>Kutcha (Mud/Thatch)</option>
        </select>
      </div>

      <div>
        <label class="font-label-lg text-on-surface-variant block mb-1">Standard of Living</label>
        <select class="w-full h-[56px] px-4 border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest">
          <option>Average</option>
          <option>Below Average</option>
          <option>Good</option>
        </select>
      </div>
    </div>
    
    <div class="space-y-md">
      <h3 class="font-title-lg text-[16px] text-on-surface border-b border-outline-variant pb-2">Photographic Evidence</h3>
      
      <div class="grid grid-cols-2 gap-4">
        <button type="button" class="h-[120px] border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center text-primary hover:bg-surface-container transition-colors">
          <span class="material-symbols-outlined mb-1 text-[32px]">home</span>
          <span class="font-label-sm text-center">House Exterior<br>(with applicant)</span>
        </button>
        <button type="button" class="h-[120px] border-2 border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center text-primary hover:bg-surface-container transition-colors">
          <span class="material-symbols-outlined mb-1 text-[32px]">storefront</span>
          <span class="font-label-sm text-center">Business Place<br>(if applicable)</span>
        </button>
      </div>
    </div>
  </form>

  <div class="mt-xl flex gap-md">
    <button onclick="window.history.back()" class="flex-1 h-[56px] border border-outline text-primary rounded-lg font-label-lg active:scale-95 transition-transform">Back</button>
    <a href="dashboard.html" class="flex-[2] h-[56px] bg-primary text-on-primary rounded-lg font-label-lg flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform">
      Submit Visit
      <span class="material-symbols-outlined">send</span>
    </a>
  </div>
</main>
</body>
</html>
