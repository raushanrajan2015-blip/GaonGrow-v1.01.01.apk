<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GaonGrow - eKYC Data</title>
  <script src="../config/tailwind-setup.js"></script>
  <script src="../components/layout.js"></script>
</head>
<body class="bg-surface font-body-md text-on-surface">
<main class="mt-20 px-4 max-w-lg mx-auto pb-32">
  <div class="mb-lg flex items-center justify-between">
    <div>
      <h2 class="font-headline-md text-primary m-0">eKYC Data</h2>
      <p class="font-body-md text-on-surface-variant m-0">Fetched successfully via Aadhaar</p>
    </div>
    <div class="bg-primary-fixed text-on-primary-fixed-variant px-3 py-1 rounded-full font-label-sm flex items-center gap-1">
      <span class="material-symbols-outlined text-[16px]">verified</span> Verified
    </div>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden mb-lg shadow-sm">
    <div class="p-md flex gap-md items-center border-b border-outline-variant/50">
      <div class="w-20 h-20 bg-surface-container rounded-lg overflow-hidden border border-outline-variant">
        <img src="https://ui-avatars.com/api/?name=Savitri+Devi&background=random" class="w-full h-full object-cover" alt="Member Photo">
      </div>
      <div>
        <h3 class="font-headline-sm text-on-surface m-0">Savitri Devi</h3>
        <p class="font-data-mono text-on-surface-variant mt-1 mb-0">XXXX-XXXX-4921</p>
      </div>
    </div>
    
    <div class="p-md space-y-md">
      <div>
        <label class="font-label-sm text-outline uppercase tracking-wider block mb-1">Date of Birth</label>
        <p class="font-body-lg text-on-surface m-0">12-May-1984 (Age: 42)</p>
      </div>
      <div>
        <label class="font-label-sm text-outline uppercase tracking-wider block mb-1">Gender / Father's Name</label>
        <p class="font-body-lg text-on-surface m-0">Female / Ram Lal</p>
      </div>
      <div>
        <label class="font-label-sm text-outline uppercase tracking-wider block mb-1">Permanent Address</label>
        <p class="font-body-md text-on-surface m-0 leading-relaxed">
          House No. 42, Ward 3,<br>
          Near Shiva Temple, Village Pithora,<br>
          District Mahasamund, Chhattisgarh 493551
        </p>
      </div>
    </div>
  </div>

  <div class="flex gap-md mt-xl">
    <button onclick="window.history.back()" class="flex-1 h-[56px] border border-outline text-primary rounded-lg font-label-lg active:scale-95 transition-transform">Retake</button>
    <a href="address_family.html" class="flex-1 h-[56px] bg-primary text-on-primary rounded-lg font-label-lg flex items-center justify-center active:scale-95 transition-transform shadow-sm">Continue</a>
  </div>
</main>
</body>
</html>
