<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GaonGrow - Center Management</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet"/>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#012d1d",
            "secondary": "#1db2c9",
            "surface": "#f8fafc",
            "on-surface": "#1e293b",
          }
        }
      }
    }
  </script>
  <style>
    .tab-active {
        color: #012d1d;
        border-bottom: 3px solid #012d1d;
    }
    .center-card {
        transition: all 0.2s ease;
    }
    .center-card:active {
        transform: scale(0.98);
        background-color: #f1f5f9;
    }
  </style>
</head>
<body class="bg-surface font-['Public_Sans'] text-on-surface min-h-screen">

<!-- PREMIUM SIDEBAR TEMPLATE -->
<div id="sidebar_backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[90] hidden lg:hidden" onclick="toggleSidebar()"></div>
<aside id="main_sidebar" class="fixed inset-y-0 left-0 z-[100] w-80 bg-[#011a14] text-slate-400 flex flex-col shrink-0 overflow-hidden shadow-2xl border-r border-white/5 font-['Public_Sans'] transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out">
    <!-- Header Section: Premium Branding -->
    <div class="p-8 border-b border-white/5 flex items-center gap-5 bg-gradient-to-b from-[#012d1d] to-transparent">
        <div class="w-14 h-14 bg-white rounded-[1.25rem] flex items-center justify-center p-2 shadow-2xl shadow-white/10 overflow-hidden shrink-0 border border-slate-200/50 group-hover:scale-110 transition-transform duration-500">
            <img src="../assets/gaongrow_tractor_logo.png" class="w-full h-full object-contain filter drop-shadow-md" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2554/2554904.png'" />
        </div>
        <div>
            <h1 class="text-[17px] font-black tracking-tighter text-white uppercase leading-none mb-1.5">GaonGrow <span class="text-secondary">Finance</span></h1>
            <p class="text-[9px] font-extrabold text-slate-500 uppercase tracking-[0.25em] opacity-80">Core Banking System</p>
        </div>
    </div>

    <!-- User Profile: Dynamic & Premium -->
    <div class="px-8 py-6 border-b border-white/5 bg-white/5 group">
        <div class="flex items-center gap-4">
            <div class="relative">
                <div id="user_initials_circle" class="w-11 h-11 bg-gradient-to-tr from-secondary to-yellow-600 rounded-2xl flex items-center justify-center text-navy font-black text-xs shadow-xl group-hover:rotate-12 transition-all duration-500">
                    --
                </div>
                <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-primary border-2 border-[#011a14] rounded-full"></span>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <p id="user_display_role" class="text-[12px] font-black text-white uppercase tracking-tight">Loading...</p>
                    <span id="user_display_id" class="text-[8px] bg-white/10 px-1.5 py-0.5 rounded-md text-slate-400 font-bold">---</span>
                </div>
                <p id="user_full_name" class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-0.5 flex items-center gap-1">
                    <span class="w-1 h-1 bg-primary rounded-full animate-pulse"></span>
                    Live Session
                </p>
            </div>
        </div>
    </div>

    <!-- Dynamic Navigation List -->
    <nav id="dynamicMenuContainer" class="flex-1 overflow-y-auto custom-scrollbar px-4 py-6 space-y-2">
        <!-- Menu items will be injected here via menuService.js -->
        {{DYNAMIC_MENU}}
    </nav>


    <!-- Logout Area -->
    <div class="p-6 border-t border-white/5 bg-white/5">
        <button onclick="logoutAdmin()" class="w-full flex items-center justify-center gap-3 px-4 py-4 rounded-2xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all duration-300 group shadow-xl">
            <span class="material-symbols-outlined text-[22px] group-hover:rotate-180 transition-transform duration-500">logout</span>
            <span class="text-[11px] font-black uppercase tracking-widest">Exit System</span>
        </button>
    </div>

    <!-- Dynamic Menu Loader -->
    <script type="module">
        import { getMenuForRole, renderMenuHTML } from '../services/menuService.js';
        
        // Global Helpers
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('main_sidebar');
            const backdrop = document.getElementById('sidebar_backdrop');
            if (sidebar) {
                const isOpen = sidebar.classList.contains('translate-x-0');
                if (isOpen) {
                    sidebar.classList.replace('translate-x-0', '-translate-x-full');
                    if (backdrop) backdrop.classList.add('hidden');
                } else {
                    sidebar.classList.replace('-translate-x-full', 'translate-x-0');
                    if (backdrop) backdrop.classList.remove('hidden');
                }
            }
        };

        window.toggleSubmenu = (id) => {
            const menu = document.getElementById(id);
            const arrow = document.querySelector(`#${id} + button #arrow_${id}`) || document.querySelector(`[onclick="toggleSubmenu('${id}')"] .transition-transform`);
            if (menu) {
                menu.classList.toggle('hidden');
                if (arrow) {
                    const isHidden = menu.classList.contains('hidden');
                    arrow.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(90deg)';
                }
            }
        };

        window.logoutAdmin = () => {
            localStorage.removeItem('gaongrow_admin_session');
            localStorage.removeItem('gaongrow_session');
            window.location.href = 'login.html';
        };

        // Role Detection
        const sessionStr = localStorage.getItem('gaongrow_admin_session') || localStorage.getItem('gaongrow_session');
        const session = sessionStr ? JSON.parse(sessionStr) : null;
        
        const roleMap = {
            1: 'SUPER_ADMIN',
            2: 'HO_USER',
            3: 'BRANCH_MANAGER',
            4: 'CRO',
            5: 'AUDITOR'
        };

        let role = 'HO_USER';
        if (session && session.user) {
            const r = session.user.role || session.user.role_id;
            role = typeof r === 'string' ? r.toUpperCase() : (roleMap[r] || 'HO_USER');
        }

        // Render Menu
        const menuItems = getMenuForRole(role);
        const container = document.getElementById('dynamicMenuContainer');
        if (container) {
            container.innerHTML = renderMenuHTML(menuItems);
        }

        // CRO Visibility Hardening: Hide sidebar and toggles for CROs (Mobile Focused)
        if (role === 'CRO') {
            const sidebar = document.getElementById('main_sidebar');
            const backdrop = document.getElementById('sidebar_backdrop');
            if (sidebar) sidebar.style.setProperty('display', 'none', 'important');
            if (backdrop) backdrop.style.setProperty('display', 'none', 'important');
            
            // Hide all hamburger/sidebar toggle buttons
            document.querySelectorAll('[onclick="toggleSidebar()"]').forEach(btn => {
                btn.style.setProperty('display', 'none', 'important');
            });
        }

        // Populate User Info
        if (session && session.user) {
            const user = session.user;
            const name = user.employee_name || user.full_name || user.name || 'User';
            const roleName = typeof user.role === 'string' ? user.role : (roleMap[user.role] || user.role_name || 'Staff');
            const empId = user.employee_id || user.id || '---';

            if (document.getElementById('user_display_role')) document.getElementById('user_display_role').textContent = roleName;
            if (document.getElementById('user_display_id')) document.getElementById('user_display_id').textContent = empId;
            if (document.getElementById('user_full_name')) {
                document.getElementById('user_full_name').innerHTML = `
                    <span class="w-1 h-1 bg-primary rounded-full animate-pulse"></span>
                    ${name}
                `;
            }
            
            // Initials
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            if (document.getElementById('user_initials_circle')) document.getElementById('user_initials_circle').textContent = initials;
        }
    </script>
</aside>















<!-- Top Bar -->
<header class="bg-primary text-white h-16 flex items-center px-4 sticky top-0 z-50 shadow-lg">
    <button onclick="window.location.href='dashboard.html'" class="p-2 -ml-2 active:scale-95 transition-transform">
        <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="ml-2 text-lg font-bold">All Centers</h1>
</header>

<main class="max-w-lg mx-auto">
    
    <!-- Tabs -->
    <div class="flex border-b border-slate-200 bg-white sticky top-16 z-40">
        <button onclick="switchTab('active')" id="tab_active" class="flex-1 py-4 text-sm font-bold text-slate-500 tab-active text-center">
            ACTIVE CENTERS
        </button>
        <button onclick="switchTab('progress')" id="tab_progress" class="flex-1 py-4 text-sm font-bold text-slate-500 text-center">
            IN PROGRESS
        </button>
    </div>

    <!-- Search Bar -->
    <div class="p-4">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">search</span>
            <input id="center_search" type="text" placeholder="Search center or village..." class="w-full h-[50px] pl-12 pr-4 rounded-xl border border-slate-200 bg-white focus:border-secondary outline-none text-sm font-medium" />
        </div>
    </div>

    <!-- List Container -->
    <div id="list_container" class="px-4 space-y-3 pb-24">
    </div>

</main>

<!-- Member Modal -->
<div id="member_modal" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="absolute bottom-0 left-0 w-full bg-white rounded-t-[2.5rem] p-6 max-h-[85vh] overflow-y-auto animate-in slide-in-from-bottom duration-300">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <div class="flex justify-between items-start mb-6">
            <div>
                <h2 id="modal_center_name" class="text-xl font-black text-primary">Center Name</h2>
                <p id="modal_center_info" class="text-xs text-slate-500 font-bold uppercase tracking-widest mt-1">0 Active Members</p>
            </div>
            <button onclick="closeModal()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        
        <div id="member_list" class="space-y-3">
        </div>
    </div>
</div>

<script type="module">
    import supabase from '../services/supabase.js'

    let currentTab = 'active';
    let allCenters = [];

    async function init() {
        const sessionStr = localStorage.getItem("gaongrow_session");
        if (!sessionStr) { window.location.href = "login.html"; return; }
        fetchCenters();
        checkApprovedVillages();
    }

    async function checkApprovedVillages() {
        const session = JSON.parse(localStorage.getItem("gaongrow_session"));
        const btnAdd = document.getElementById('btn_add_center');
        
        // Check if there is at least one approved village for this user
        const { data, error } = await supabase
            .from('village_surveys')
            .select('id')
            .eq('officer_id', session.user.employee_id)
            .eq('status', 'approved')
            .limit(1);

        if (!error && data && data.length > 0) {
            // Enable the button
            btnAdd.classList.remove('bg-slate-300', 'cursor-not-allowed');
            btnAdd.classList.add('bg-primary', 'hover:scale-105', 'active:scale-95');
            btnAdd.dataset.enabled = 'true';
        } else {
            btnAdd.dataset.enabled = 'false';
        }
    }

    window.handleAddCenter = function() {
        window.location.href = 'center_creation.html';
    }

    async function fetchCenters() {
        const session = JSON.parse(localStorage.getItem("gaongrow_session"));
        const { data, error } = await supabase
            .from('centers')
            .select('*')
            .eq('officer_id', session.user.employee_id)
            .order('created_at', { ascending: false });

        if (!error) {
            allCenters = data || [];
            renderList();
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab_active').classList.toggle('tab-active', tab === 'active');
        document.getElementById('tab_progress').classList.toggle('tab-active', tab === 'progress');
        renderList();
    }

    function renderList() {
        const container = document.getElementById('list_container');
        const searchTerm = document.getElementById('center_search').value.toLowerCase();
        
        const filtered = allCenters.filter(c => {
            const matchesSearch = c.center_name.toLowerCase().includes(searchTerm) || 
                                 (c.village_id && c.village_id.toLowerCase().includes(searchTerm));
            const isTabMatch = (currentTab === 'active' && c.status === 'approved') || 
                               (currentTab === 'progress' && c.status !== 'approved');
            return matchesSearch && isTabMatch;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="text-center py-20 opacity-30">
                    <span class="material-symbols-outlined text-[64px]">inventory_2</span>
                    <p class="text-sm font-bold mt-2">No ${currentTab} centers found</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(c => `
            <div onclick="openCenter('${c.id}', '${c.center_name}')" class="center-card bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 ${currentTab === 'active' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'} rounded-xl flex items-center justify-center">
                    <span class="material-symbols-outlined">${currentTab === 'active' ? 'verified' : 'pending_actions'}</span>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <h3 class="font-black text-primary uppercase text-[14px] tracking-tight">${c.center_name}</h3>
                        <span class="text-[9px] font-black bg-slate-100 px-1.5 py-0.5 rounded text-slate-500">${c.center_code}</span>
                    </div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${c.village_id || 'N/A'} • ${c.block_name}</p>
                </div>
                <div class="text-right">
                    <p class="text-[12px] font-black text-primary">${currentTab === 'active' ? '12 Members' : 'In Sourcing'}</p>
                    <p class="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">View Details</p>
                </div>
            </div>
        `).join('');
    }

    async function openCenter(id, name) {
        if (currentTab === 'progress') {
            alert("This center is in Progress. CGT/GRT process pending.");
            return;
        }

        document.getElementById('modal_center_name').innerText = name;
        document.getElementById('member_modal').classList.remove('hidden');
        document.getElementById('member_list').innerHTML = `<div class="py-10 text-center opacity-30 animate-pulse"><span class="material-symbols-outlined animate-spin">refresh</span></div>`;

        const { data: members, error } = await supabase
            .from('employees') 
            .select('*')
            .limit(10);

        if (!error && members) {
            document.getElementById('modal_center_info').innerText = `${members.length} Active Members`;
            document.getElementById('member_list').innerHTML = members.map(m => `
                <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center font-bold text-xs">
                        ${m['Employee Name'].split(' ').map(n => n[0]).join('')}
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-black text-primary">${m['Employee Name']}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">ID: ${m['Employee Id']}</p>
                    </div>
                </div>
            `).join('');
        }
    }

    function closeModal() {
        document.getElementById('member_modal').classList.add('hidden');
    }

    document.getElementById('center_search').addEventListener('input', renderList);
    window.switchTab = switchTab;
    window.openCenter = openCenter;
    window.closeModal = closeModal;

    init();
</script>
</body>
</html>
